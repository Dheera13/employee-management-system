
<div class="container mt-4">

    <!-- Page Title -->
    <div class="mb-3">
        <h4>Department Master</h4>
    </div>

    <!-- Form Section -->
    <div class="card p-3 mb-4 shadow-sm">
        <div class="row align-items-end">

            <!-- Department Name -->
            <div class="col-md-3">
                <label class="form-label">Department Name</label>
                <input type="text" [(ngModel)]="newDeptObj.departmentName" class="form-control" placeholder="Enter department name">
            </div>

            <!-- Is Active -->
            <div class="col-md-2">
                <label class="form-label d-block">Status</label>
                <div class="form-check mt-2">
                    <input [(ngModel)]="newDeptObj.isActive" class="form-check-input" type="checkbox" id="isActive">
                    <label class="form-check-label" for="isActive">
                        Active
                    </label>
                </div>
            </div>

            <!-- Buttons -->
            <div class="col-md-4">
                @if (newDeptObj.departmentId == 0) {
                    <button (click)="saveDepartment()" class="btn btn-primary me-2">
                        <i class="fas fa-save"></i> Save
                    </button>
                } @else {
                    <button (click)="updateDepartment()" class="btn btn-primary me-2">
                        <i class="fas fa-save"></i> Update
                    </button>
                }
                <button (click)="resetForm()" class="btn btn-secondary">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>

        </div>
    </div>

    <!-- Table Section -->
    <div class="card p-3 shadow-sm">
        <div class="table-responsive">

            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Department Name</th>
                        <th>Status</th>
                        <th width="120">Action</th>
                    </tr>
                </thead>

                <tbody>
                    
                    @for (item of deptList(); track $index) {
                        <tr>
                            <td>{{$index + 1}}</td>
                            <td>{{item.departmentName}}</td>
                            <td>
                                <span class="badge" [ngClass]="item.isActive ? 'bg-success' : 'bg-secondary'">
                                    {{item.isActive ? 'Active' : 'Inactive'}}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-info me-1" (click)="OnEdit(item)">Edit
                                    <i class="fas fa-edit"></i>
                                </button>
                                
                                <button class="btn btn-sm btn-danger" (click)="OnDelete(item)">Delete
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
        
                        </tr>
                    }    

                    
                </tbody>

            </table>

        </div>
    </div>

</div>
