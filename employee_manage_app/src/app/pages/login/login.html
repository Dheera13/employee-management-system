<div class="vh-100 d-flex align-items-center justify-content-center bg-light login-page">
  <div class="card shadow-lg border-0 p-4 login-card animate-fade-in">
    <div class="text-center mb-4">
      <h1 class="h3 mb-2">Welcome Back</h1>
      <p class="text-muted mb-0">Sign in to manage your employee records.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" [(ngModel)]="loginObj.email" name="email" class="form-control form-control-lg" id="email" placeholder="name@example.com" />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contact Number</label>
        <input type="password" [(ngModel)]="loginObj.contactNbr" name="contactNbr" class="form-control form-control-lg" id="password" placeholder="Enter your contact number" />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="remember" />
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="#" class="small text-decoration-none">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
    </form>

    <div class="text-center mt-4 text-muted small">
      New here? <a href="#" class="text-decoration-none">Create an account</a>
    </div>
  </div>
</div>
